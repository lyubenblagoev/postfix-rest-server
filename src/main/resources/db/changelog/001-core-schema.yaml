                    primaryKeyName: pk_recipient_bccs
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: updated
                  type: timestamp
              - column:
                  name: receiver_email_address
                  type: varchar(255)
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_recipient_bccs_account
                    references: accounts(id)

  - changeSet:
