                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_roles_user
                    references: users(id)
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_roles_role
                    references: roles(id)

  - changeSet:
      id: 010-create-audit-logs
      author: postfix-rest-server
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: audit_logs
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_logs
                    nullable: false
              - column:
                  name: action
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: actor_user_id
                  type: bigint
              - column:
                  name: actor_username
                  type: varchar(320)
                  constraints:
                    nullable: false

  - changeSet:
      id: 011-create-audit-log-changes
      author: postfix-rest-server
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: audit_log_changes
      changes:
        - createTable:
            tableName: audit_log_changes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_log_changes
                    nullable: false
              - column:
                  name: audit_log_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_audit_log_changes_log
                    references: audit_logs(id)
              - column:
                  name: field_name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: old_value
                  type: varchar(2048)
              - column:
                  name: new_value
                  type: varchar(2048)

  - changeSet:
      id: 012-index-accounts-domain-enabled
      author: postfix-rest-server
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_account_domain_enabled
      changes:
        - createIndex:
            indexName: idx_account_domain_enabled
            tableName: accounts
            columns:
