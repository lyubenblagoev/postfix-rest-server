databaseChangeLog:
  - changeSet:
      id: 001-create-domains
      author: postfix-rest-server
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: domains
      changes:
        - createTable:
            tableName: domains
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_domains
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: updated
                  type: timestamp
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-accounts
      author: postfix-rest-server
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: accounts
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: updated
                  type: timestamp
              - column:
                  name: username
                  type: varchar(255)
              - column:
                  name: password
                  type: varchar(255)
              - column:
                  name: domain_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_accounts_domain
                    references: domains(id)

  - changeSet:
      id: 003-create-aliases
      author: postfix-rest-server
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
