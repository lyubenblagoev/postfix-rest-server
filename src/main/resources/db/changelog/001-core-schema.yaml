                    primaryKey: true
                    primaryKeyName: pk_user_devices
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: updated
                  type: timestamp
              - column:
                  name: refresh_token
                  type: varchar(255)
              - column:
                  name: refresh_token_expiration_date
                  type: timestamp
              - column:
                  name: remote_address
                  type: varchar(255)
              - column:
