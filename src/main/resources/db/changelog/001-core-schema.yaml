            tableName: aliases
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_aliases
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: updated
                  type: timestamp
              - column:
                  name: alias
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: domain_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_aliases_domain
                    references: domains(id)

  - changeSet:
